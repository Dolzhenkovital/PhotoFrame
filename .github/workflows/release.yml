name: Release

# Tag vX.Y.Z → tested, signed release APK attached to a GitHub Release.
# Sideloading is the primary distribution for photo frames (ci-cd skill).
#
# Required secrets — the build FAILS without them (an unsigned APK cannot be
# installed, so publishing one would be a broken release):
# RELEASE_KEYSTORE_BASE64 (base64 of the .jks), RELEASE_KEYSTORE_PASSWORD,
# RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD.
#
# Two jobs on purpose: the BUILD job executes the tagged commit's Gradle
# code next to the signing secrets, so it gets read-only repo access; the
# tiny PUBLISH job holds the only write-capable token and runs no
# repository-controlled code at all.

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Validate tag format
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not vX.Y.Z — refusing to release."
            exit 1
          fi

      # SHA-pinned: this job handles signing secrets, so a hijacked mutable
      # tag must not be able to swap the action code underneath it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # Keep even the read token out of .git/config while
          # repository-controlled Gradle code runs.
          persist-credentials: false

      # Releases are built only from code that went through the PR process:
      # a tag pointing at a commit outside main's history is refused before
      # any of its Gradle code runs near the secrets.
      - name: Verify the tagged commit is on main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not point to a commit on main — refusing to release."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle testReleaseUnitTest

      - name: Decode signing keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$RELEASE_KEYSTORE_BASE64" ] && missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -z "$RELEASE_KEYSTORE_PASSWORD" ] && missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -z "$RELEASE_KEY_ALIAS" ] && missing="$missing RELEASE_KEY_ALIAS"
          [ -z "$RELEASE_KEY_PASSWORD" ] && missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Refusing to publish an UNSIGNED release. Missing secrets:$missing"
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 did not decode to a non-empty keystore"
            exit 1
          fi
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GP_OAUTH_CLIENT_ID: ${{ secrets.GP_OAUTH_CLIENT_ID }}
          GP_OAUTH_CLIENT_SECRET: ${{ secrets.GP_OAUTH_CLIENT_SECRET }}
        run: |
          gradle assembleRelease
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [ -z "$apk" ]; then
            echo "::error::No release APK produced"
            exit 1
          fi
          cp "$apk" "PhotoFrame-$GITHUB_REF_NAME.apk"

      - name: Hand the APK to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-apk
          path: PhotoFrame-*.apk
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch the built APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-apk

      - name: Create GitHub release with APK
        run: |
          gh release create "$GITHUB_REF_NAME" PhotoFrame-*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "PhotoFrame $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
