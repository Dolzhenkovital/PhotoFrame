name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The repo intentionally has no committed Gradle wrapper jar;
      # CI provisions the pinned Gradle version itself.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Android Lint
        run: gradle lintDebug

      # Optional shared debug key: lets the artifact APK pass Google Photos
      # sign-in (the OAuth client is matched by signing SHA-1; a random
      # runner-generated debug key would not match).
      - name: Use shared debug keystore when provided
        id: debug_keystore
        env:
          # push runs only (this workflow's push trigger is main-only): a PR
          # run executes Gradle code from the PR branch, which could read a
          # decoded keystore — PR builds keep the random runner key instead.
          DEBUG_KEYSTORE_BASE64: ${{ github.event_name == 'push' && secrets.DEBUG_KEYSTORE_BASE64 || '' }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            umask 077 # owner-only file mode for the decoded private key
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "path=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::notice::Shared debug keystore not used (PR run, or DEBUG_KEYSTORE_BASE64 not set) — this artifact APK will not match the Google OAuth client. Grab the artifact from a main-branch run instead."
          fi

      - name: Assemble debug APK
        env:
          DEBUG_KEYSTORE_PATH: ${{ steps.debug_keystore.outputs.path }}
          # Desktop-app OAuth client for the loopback sign-in. push runs
          # only, same reasoning as the keystore above: a PR run executes
          # Gradle code from the PR branch, which could exfiltrate the env.
          GP_OAUTH_CLIENT_ID: ${{ github.event_name == 'push' && secrets.GP_OAUTH_CLIENT_ID || '' }}
          GP_OAUTH_CLIENT_SECRET: ${{ github.event_name == 'push' && secrets.GP_OAUTH_CLIENT_SECRET || '' }}
        run: gradle assembleDebug

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/debug.keystore"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: photoframe-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: app/build/reports/
          retention-days: 14
          if-no-files-found: ignore
